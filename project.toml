# ---------------------------------------------------------------
# IRXJCL - Batch Entry Point (PGM=IRXJCL, WP-CPS-08 / TSK-220)
# MVS loads this when a JCL step specifies EXEC PGM=IRXJCL.
# Entry is @@CRT0 (crent370 bootstrap); main() in IRX#JCLM
# reconstructs the single-arg-string from @@START-split argv
# and delegates to irx_jcl_dispatch_main in IRX#JCL.
#
# REUS dropped: @@CRT0/main() setup is incompatible with REUS
# (same as all other @@CRT0 test/service modules).
# Programmatic CALL IRXJCL support: deferred to WP-CPS-08c.
#
# Invocation:
#   Batch  :  EXEC PGM=IRXJCL,PARM='MYMEMBER args...'
#
# Reference: WP-CPS-08 / TSK-220 / GitHub mvslovers/rexx370#126
# ---------------------------------------------------------------
[[module]]
name = "IRXJCL"
startup = "crt1"
sources = [
  "src/irx#jclm.c",
  "src/irx#jcl.c",
  "src/irx#load.c",
  "src/irx#exec.c",
  "src/irx#bcom.c",
  "src/irx#bvm.c",
  "src/irx#bctl.c",
  "src/irx#init.c",
  "src/irx#term.c",
  "src/irx#stor.c",
  "src/irx#anch.c",
  "src/irx#uid.c",
  "src/irx#msid.c",
  "src/irx#cond.c",
  "src/irx#bif.c",
  "src/irx#bifs.c",
  "src/irx#io.c",
  "src/irx#lstr.c",
  "src/irx#tokn.c",
  "src/irx#vpol.c",
  "src/irx#pars.c",
  "src/irx#ctrl.c",
  "src/irx#arith.c",
  "asm/istso.asm",
]

# ===================================================================
# Test load modules ([[test]] -- built by 'make test', not deployed)
# ===================================================================

# ---------------------------------------------------------------
# TSTANCH - ENVBLOCK anchor smoketest pseudomodule
# Runs in TSO (CALL 'TSTANCH') or Batch (EXEC PGM=TSTANCH).
# Pulls in the full phase-1/phase-2 object set so IRXINIT and
# IRXTERM link cleanly; it exits with RC=0 on push/pop success.
#
# Listed before IRXJCL so the TSTANCH load module links even while
# the full IRXJCL CSECT (the batch entry point) has not been
# implemented yet — IRXJCL's link step is expected to fail at this
# phase, TSTANCH must not be blocked by it.
# ---------------------------------------------------------------
[[test]]
name = "TSTANCH"
startup = "crt1"
sources = [
  "test/tstanch.c",
  "src/irx#init.c",
  "src/irx#term.c",
  "src/irx#stor.c",
  "src/irx#anch.c",
  "src/irx#uid.c",
  "src/irx#msid.c",
  "src/irx#cond.c",
  "src/irx#bif.c",
  "src/irx#bifs.c",
  "src/irx#io.c",
  "src/irx#lstr.c",
  "src/irx#tokn.c",
  "src/irx#vpol.c",
  "src/irx#pars.c",
  "src/irx#ctrl.c",
  "src/irx#exec.c",
  "src/irx#bcom.c",
  "src/irx#bvm.c",
  "src/irx#bctl.c",
  "src/irx#arith.c",
  "asm/istso.asm",
]

# ---------------------------------------------------------------
# TSTTOKN - WP-10 tokenizer unit tests (pilot MVS test load module).
