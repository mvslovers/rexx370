rent = false             # C program with @@CRT0: not reusable
reus = false
sources = [
  "src/irx#helo.c",
  "src/irx#init.c",
  "src/irx#term.c",
  "src/irx#stor.c",
  "src/irx#anch.c",
  "src/irx#svc.c",
  "src/irx#uid.c",
  "src/irx#msid.c",
  "src/irx#cond.c",
  "src/irx#emsg.c",
  "src/irx#bif.c",
  "src/irx#bifs.c",
  "src/irx#lstr.c",
  "src/irx#tokn.c",
  "src/irx#vpol.c",
  "src/irx#pars.c",
  "src/irx#ctrl.c",
  "src/irx#exec.c",
  "src/irx#bcom.c",
  "src/irx#bvm.c",
  "src/irx#bctl.c",
  "src/irx#arith.c",
  "asm/istso.asm",
]

# ---------------------------------------------------------------
# IRXJCL - Batch Entry Point (PGM=IRXJCL,PARM='member args...')
# A thin assembler entry (#299): splits the PARM, finds or makes an
# environment through IRXINIT, loads the exec through the
# environment's load routine (IRXPARMS names IRXLDTSO), LOADs
# IRXEXEC to run it, IRXTERMs its own environment and returns
# IRXEXEC's RC.  The interpreter lives in IRXEXEC alone, and IRXJCL
# needs no C runtime.  See asm/irxjcl.asm.
# ---------------------------------------------------------------
[[module]]
name = "IRXJCL"
rent = true
reus = true
entry = "IRXJCL"
startup = false
sources = ["asm/irxjcl.asm"]

# ---------------------------------------------------------------
# IRXJCLD - the C-runtime IRXJCL, kept as a lab module (#299).
# Links the whole interpreter and reads REXX370_BYTECODE and
# REXX370_BCDEBUG (SYSENV DD) for the A/B comparisons and the
# "[bc] exec=N fallback=M" line the cps measurements are gated on.
# Not part of a product install.
#
# Entry is @@CRT0; main() in IRX#JCLM reconstructs the arg string
# from @@START-split argv and calls irx_jcl_dispatch_main in IRX#JCL.
#
# Invocation:
#   Batch  :  EXEC PGM=IRXJCLD,PARM='MYMEMBER args...'
# ---------------------------------------------------------------
[[module]]
name = "IRXJCLD"
rent = false             # C program with @@CRT0: not reusable
reus = false
sources = [
  "src/irx#jclm.c",
  "src/irx#jcl.c",
  "src/irx#load.c", "src/irx#ldqs.c",
  "src/irx#exec.c",
  "src/irx#bcom.c",
  "src/irx#bvm.c",
  "src/irx#bctl.c",
  "src/irx#init.c",
  "src/irx#envt.c",
  "src/irx#term.c",
  "src/irx#stor.c",
  "src/irx#anch.c",
  "src/irx#svc.c",
  "src/irx#uid.c",
  "src/irx#msid.c",
  "src/irx#cond.c",
  "src/irx#emsg.c",
  "src/irx#bif.c",
  "src/irx#bifs.c",
  "src/irx#lstr.c",
  "src/irx#tokn.c",
  "src/irx#vpol.c",
  "src/irx#pars.c",
  "src/irx#ctrl.c",
  "src/irx#arith.c",
  "asm/istso.asm",
]

# ---------------------------------------------------------------
# Tests: rent = false, reus = false throughout.  A test program runs
# once per job step (EXEC PGM= or TSO CALL) and is never LINKed by
# several tasks at once; most start through @@CRT0, which is not
# reusable.  Their statics (capture buffers, counters) stay legal.
# ---------------------------------------------------------------
# ===================================================================
# Test load modules ([[test]] -- built by 'make test', not deployed)
# ===================================================================

# ---------------------------------------------------------------
# TSTANCH - ENVBLOCK anchor smoketest pseudomodule
# Runs in TSO (CALL 'TSTANCH') or Batch (EXEC PGM=TSTANCH).
# Pulls in the full phase-1/phase-2 object set so IRXINIT and
# IRXTERM link cleanly; it exits with RC=0 on push/pop success.
#
# Listed before IRXJCL so the TSTANCH load module links even while
# the full IRXJCL CSECT (the batch entry point) has not been
# implemented yet — IRXJCL's link step is expected to fail at this
# phase, TSTANCH must not be blocked by it.
# ---------------------------------------------------------------
[[test]]
name = "TSTANCH"
rent = false
reus = false
sources = [
  "test/tstanch.c",
  "src/irx#init.c",
  "src/irx#term.c",
  "src/irx#stor.c",
  "src/irx#anch.c",
  "src/irx#svc.c",
  "src/irx#uid.c",
  "src/irx#msid.c",
  "src/irx#cond.c",
  "src/irx#emsg.c",
  "src/irx#bif.c",
  "src/irx#bifs.c",
  "src/irx#io.c",
  "asm/irxqsam.asm",
  "src/irx#lstr.c",
  "src/irx#tokn.c",
  "src/irx#vpol.c",
  "src/irx#pars.c",
  "src/irx#ctrl.c",
  "src/irx#exec.c",
  "src/irx#bcom.c",
  "src/irx#bvm.c",
  "src/irx#bctl.c",
  "src/irx#arith.c",
  "asm/istso.asm",
]

