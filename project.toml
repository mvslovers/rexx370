# ---------------------------------------------------------------
# TEXECVL - Live MVS test caller for IRXINIT + IRXEXEC + IRXTERM.
# Same shape as TINITVL/TTERMVL: pure HLASM, no C runtime; IRXINIT,
# IRXEXEC and IRXTERM are all resolved at run time via LOAD EP= from
# STEPLIB, so the test drives the real production IRXEXEC VLIST wrapper
# end-to-end with an in-storage REXX exec — coverage the module path
# never had (only TINITVL/TTERMVL existed). Regression test for both
# WP-VLIST-WPOOL defects: (A) the standalone IRXINIT never attached the
# interpreter Work Block (IRXEXEC failed RC=20), and (B) a running deep
# exec overflowed the 8 KB WPOOL (S0C4). Green only when both are fixed
# (RC=0, the REXX 'exit 42' echoed as IRXEXEC R15=42).
#
# Invocation:
#   Batch  :  EXEC PGM=TEXECVL  (see test/jcl/texecvl.jcl)
#
# WP-VLIST-WPOOL / TSK-279 / consumer: mvslovers/httprexx.
# ---------------------------------------------------------------
[[test]]
name = "TEXECVL"
rent = false
reus = false
entry = "TEXECVL"
startup = false
sources = ["test/asm/texecvl.asm"]

# ---------------------------------------------------------------
# TREXXVL - httprexx-shaped reproducer: runs an in-storage EBCDIC exec
# through the IRXINIT/IRXEXEC VLIST via __linkds (LINK) with an
# io_routine override for SAY — exactly the mechanism httprexx uses,
# in C. Complements the pure-HLASM TEXECVL: TEXECVL stresses the WPOOL
# with a deep exec, TREXXVL mirrors the real consumer's call shape
# (LINK + io_routine + in-storage INSTBLK) and is the AC#8 proxy.
#
# A [[test]] (not a [[module]]): the runner deploys it to the TESTLIB
# and runs it with STEPLIB = TESTLIB + LINKLIB, so the LINKs to the
# production IRXINIT/IRXEXEC resolve. It returns RC 0 on success.
#
# WP-VLIST-WPOOL / TSK-279 / consumer: mvslovers/httprexx.
# ---------------------------------------------------------------
[[test]]
name = "TREXXVL"
rent = false
reus = false
host = false                # MVS-only (uses __linkds/LINK); skipped by test-host
sources = ["test/trexxvl.c", "test/trxcall.asm", "test/trxldc.asm"]

