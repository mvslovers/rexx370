  "src/irx#term.c",
  "src/irx#stor.c",
  "src/irx#anch.c",
  "src/irx#uid.c",
  "src/irx#msid.c",
  "src/irx#cond.c",
  "src/irx#bif.c",
  "src/irx#bifs.c",
  "src/irx#io.c",
  "src/irx#lstr.c",
  "src/irx#tokn.c",
  "src/irx#vpol.c",
  "src/irx#pars.c",
  "src/irx#ctrl.c",
  "src/irx#exec.c",
  "src/irx#bcom.c",
  "src/irx#bvm.c",
  "src/irx#bctl.c",
  "src/irx#arith.c",
  "asm/istso.asm",
]

