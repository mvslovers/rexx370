# ---------------------------------------------------------------
# TINITVL - Live MVS test caller for IRXINIT INITENVB.
# Pure HLASM caller (no C runtime, no @@CRT0). Drives IRXINIT
# through SC28-1883-0 §14 VLIST contract; IRXINIT itself is
# resolved at run time via LOAD EP=IRXINIT from STEPLIB —
# include list contains ONLY the test caller, no IRX#* NCAL
# pull-in, so the test exercises the real production load module.
#
# Invocation:
#   Batch  :  EXEC PGM=TINITVL  (see test/mvs/jcl/tinitvl.jcl)
#
# WP-I1c.5 / TSK-198 / GitHub mvslovers/rexx370#87.
# ---------------------------------------------------------------
[[link.module]]
name = "TINITVL"
entry = "TINITVL"
options = ["LIST", "MAP", "XREF", "RENT", "REUS"]
include = ["TINITVL"]

# ---------------------------------------------------------------
# TTERMVL - Live MVS test caller for IRXINIT INITENVB + IRXTERM.
# Same shape as TINITVL: pure HLASM, no C runtime, IRXINIT and
# IRXTERM both resolved at run time via LOAD EP= from STEPLIB.
#
# Invocation:
#   Batch  :  EXEC PGM=TTERMVL  (see test/mvs/jcl/ttermvl.jcl)
#
# WP-I1c.5 / TSK-198 / GitHub mvslovers/rexx370#87.
# ---------------------------------------------------------------
[[link.module]]
name = "TTERMVL"
entry = "TTERMVL"
options = ["LIST", "MAP", "XREF", "RENT", "REUS"]
include = ["TTERMVL"]

# ---------------------------------------------------------------
# TISTSO - Live MVS test caller for ISTSO (EXTRACT-based TSO detect).
# Pure HLASM; ISTSO is NCAL-linked in so L R15,=V(ISTSO) resolves.
# Invocation:
#   Batch : EXEC PGM=TISTSO  (see test/mvs/jcl/tistso.jcl)
#   TSO   : CALL 'hlq.LOAD(TISTSO)'
# WP-I1c.6 / GitHub mvslovers/rexx370#93.
# ---------------------------------------------------------------
[[link.module]]
name = "TISTSO"
entry = "TISTSO"
options = ["LIST", "MAP", "XREF", "RENT", "REUS"]
include = ["TISTSO", "ISTSO"]

# ---------------------------------------------------------------
# IRXJCL - Batch Entry Point (PGM=IRXJCL, WP-CPS-08 / TSK-220)
# MVS loads this when a JCL step specifies EXEC PGM=IRXJCL.
# Entry is @@CRT0 (crent370 bootstrap); main() in IRX#JCLM
# reconstructs the single-arg-string from @@START-split argv
# and delegates to irx_jcl_dispatch_main in IRX#JCL.
#
# REUS dropped: @@CRT0/main() setup is incompatible with REUS
# (same as all other @@CRT0 test/service modules).
# Programmatic CALL IRXJCL support: deferred to WP-CPS-08c.
#
# Invocation:
#   Batch  :  EXEC PGM=IRXJCL,PARM='MYMEMBER args...'
#
# Reference: WP-CPS-08 / TSK-220 / GitHub mvslovers/rexx370#126
# ---------------------------------------------------------------
[[link.module]]
name = "IRXJCL"
entry = "@@CRT0"
options = ["LIST", "MAP", "XREF", "RENT"]
include = [
  "@@CRT1",
  "IRX#JCLM",
  "IRX#JCL",
  "IRX#LOAD",
  "IRX#EXEC",
  "IRX#BCOM",
  "IRX#BVM",
  "IRX#BCTL",
  "IRX#INIT",
  "IRX#TERM",
  "IRX#STOR",
  "IRX#ANCH",
  "IRX#UID",
  "IRX#MSID",
  "IRX#COND",
  "IRX#BIF",
  "IRX#BIFS",
  "IRX#IO",
  "IRX#LSTR",
  "IRX#TOKN",
  "IRX#VPOL",
  "IRX#PARS",
  "IRX#CTRL",
  "IRX#ARIT",
]

