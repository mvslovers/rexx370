[project]
name = "rexx370"
version = "1.0.0-dev"
type = "application"

[toolchain]
# Pins the refs release.yml builds the published artifacts against; build.yml
# deliberately keeps floating on main so a cc370/libc370 regression surfaces
# in a PR build (mbt#68). cc370 is omitted -- it defaults to main and has no
# releases to pin to yet.
# 2.3.1: the C runtime startup is a member of libc.a from 2.3.0 on,
# so no module names a startup object (mvslovers/mbt#158). An older libc.a
# would quietly link crt0 where these modules used to have crt1. 2.3.1
# rather than 2.3.0 for the subtask cleanup fix (mvslovers/libc370#431).
libc370 = "2.3.1"

[build]
# -Os after mbt's -O1 (the last -O wins): about 8 % smaller code, which
# counts for REGION and later for the LPA (#258, #300). cc370 calls -Os
# experimental and leaves its validation to the project; rexx370's is in
# #258 (full suite batch + TSO, REGION ladder, production modules -Os).
cflags = ["-std=gnu99", "-I", "include", "-Os"]

# Host build (`make test-host`): the dual test/*.c tests run natively for a
# fast inner loop. lstring370 is linked from source on the host (the staged
# .mbt/deps .a is the cc370 cross build); -Wall -Wextra to catch more.
[host]
cflags = ["-Wall", "-Wextra"]
sources = ["../lstring370/src/lstr#*.c"]
# is_tso() resolves to the asm CSECT on MVS (asm/istso.asm) but to a stub on
# the host (src/irx#env.c, #ifndef __MVS__). Swap it for the native build.
replace = { "asm/istso.asm" = "src/irx#env.c", "asm/putlin.asm" = "src/irx#putl.c", "asm/irxqsam.asm" = "src/irx#qsmh.c" }

# crent370 is provided by the cc370 sysroot (libc370) in v2, so it is no
# longer a declared dependency (same as the ufsd/ftpd v2 migrations).
# lstring370 is staged via .mbt/deps (local path override until it ships a
# v2 -lib.tar.gz release).
[dependencies]
"mvslovers/lstring370" = ">=1.0.0-dev"

[release]
version_files = ["VERSION"]

# ===================================================================
# Production load modules
# ===================================================================

# ---------------------------------------------------------------
# IRXANCHR - Language Processor Environment table (data module).
# Static table: 32-byte header + 64 x 40-byte slot array.
# Loaded at runtime via LOAD EP=IRXANCHR by irx_anchor_get_handle().
# No C runtime — pure assembler data object.
# ---------------------------------------------------------------
[[module]]
name = "IRXANCHR"
rent = false             # self-modified slot array: REUS, not RENT
reus = true
entry = "IRXANCHR"
startup = false
sources = ["asm/irxanchr.asm"]

# ---------------------------------------------------------------
# IRXPARMS / IRXTSPRM / IRXISPRM - Default Parameter Modules.
# Static data objects: PARMBLOCK + MODNAMET + SUBCOMTB + PACKTB.
# Loaded by IRXINIT via LOAD EP=IRXxxxxx when the caller supplies
# no explicit PARMBLOCK (CON-1 §6.3, step 4).
# No C runtime — pure assembler data objects.
# ---------------------------------------------------------------
[[module]]
name = "IRXPARMS"
rent = true
reus = true
entry = "IRXPARMS"
startup = false
sources = ["asm/irxparms.asm"]

[[module]]
name = "IRXTSPRM"
rent = true
reus = true
entry = "IRXTSPRM"
startup = false
sources = ["asm/irxtsprm.asm"]

[[module]]
name = "IRXISPRM"
rent = true
reus = true
entry = "IRXISPRM"
startup = false
sources = ["asm/irxisprm.asm"]

# ---------------------------------------------------------------
# IRXINIT - HLASM Entry-Point Wrapper for the IRXINIT Programming
#          Service (SC28-1883-0 §14). Parses the caller VLIST,
#          extracts the function code, and delegates to the C-core
#          dispatcher irx_init_dispatch (asm() alias IRXIDISP).
#
# Built as a separate load module (per IBM convention IRXINIT and
# IRXTERM are independent load modules). The wrapper is the entry
# point; the C-core (IRX#INIT, IRX#TERM, IRX#STOR, IRX#ANCH,
# IRX#UID, IRX#MSID) is NCAL-linked into the same load module so
# the BALR R14,R15 to =V(IRXIDISP) resolves. IRX#IO carries the
# default I/O routine IRXEXTE points at until #255.
#
# Environment core only - no tokenizer, parser, VM or BIFs (#254).
# IRXINIT and IRXTERM link the same set; ld370 must resolve it
# without --allow-unresolved. The interpreter lives in IRXEXEC.
#
# WP-I1c.5 / TSK-198 / GitHub mvslovers/rexx370#83.
# ---------------------------------------------------------------
[[module]]
name = "IRXINIT"
rent = true
reus = true
entry = "IRXINIT"
startup = false
sources = [
  "asm/irxinit.asm",
  "src/irx#init.c",
  "src/irx#term.c",
  "src/irx#stor.c",
  "src/irx#anch.c",
  "src/irx#svc.c",
  "asm/istso.asm",
]

# ---------------------------------------------------------------
# IRXTERM - HLASM Entry-Point Wrapper for the IRXTERM Programming
#          Service (SC28-1883-0 §15). Reads R0=ENVBLOCK, calls the
#          C-core irx_init_term (asm() alias IRXITERM), and reads
#          back ECTENVBK via anch_curr (alias ANCHCURR) to return
#          the predecessor envblock in R0.
#
# WP-I1c.5 / TSK-198 / GitHub mvslovers/rexx370#83.
# ---------------------------------------------------------------
[[module]]
name = "IRXTERM"
rent = true
reus = true
entry = "IRXTERM"
startup = false
sources = [
  "asm/irxterm.asm",
  "src/irx#init.c",
  "src/irx#term.c",
  "src/irx#stor.c",
  "src/irx#anch.c",
  "src/irx#svc.c",
  "asm/istso.asm",
]

# ---------------------------------------------------------------
# IRXLOAD - HLASM Entry-Point Wrapper for the IRXLOAD Programming
#           Service (SC28-1883-0 §14). Parses the 5-slot VLIST,
#           validates the function code, and delegates to the
#           C-core dispatcher irx_load_dispatch (asm() alias
#           IRXLDISP) which routes LOAD/FREE sub-functions.
#
# LOAD builds an INSTBLK from REXX source in a PDS member.
# FREE releases the INSTBLK and its source pool.
#
# WP-CPS-07 / TSK-219 / GitHub mvslovers/rexx370#118.
# ---------------------------------------------------------------
[[module]]
name = "IRXLOAD"
rent = true
reus = true
entry = "IRXLOAD"
startup = false
sources = ["asm/irxload.asm", "src/irx#load.c", "src/irx#ldqs.c", "src/irx#stor.c"]

# ---------------------------------------------------------------
# IRXLDTSO - the exec load routine for TSO environments (GitHub #230).
# The same wrapper and load logic as IRXLOAD, linked with a different
# member reader: BPAM through asm/irxbpam.asm instead of fopen. stdio
# needs a C runtime, and a TSO address space driven from assembler has
# none -- IRXLOAD's LOAD ABENDs S0C4 there. IRXTSPRM names IRXLDTSO in
# MODNAMET EXROUT, IRXINIT LOADs it into IRXEXTE's load_routine, and
# IRXTERM DELETEs it. The entry point is the wrapper's CSECT IRXLOAD.
# ---------------------------------------------------------------
[[module]]
name = "IRXLDTSO"
rent = true
reus = true
entry = "IRXLOAD"
startup = false
sources = ["asm/irxload.asm", "src/irx#load.c", "src/irx#ldbp.c", "asm/irxbpam.asm", "src/irx#stor.c"]

# ---------------------------------------------------------------
# IRXEXEC - HLASM Entry-Point Wrapper for the IRXEXEC Programming
#           Service (z/OS 10-slot VLIST form). Parses the VLIST,
#           validates VL-marker on P9 or P10, and delegates to the
#           C-core dispatcher irx_exec_dispatch (asm() alias
#           IRXEDISP) which performs three-path env resolution,
#           INSTBLK source reconstruction, ARGTABLE parse, engine
#           call via irx_exec_run, and EVALBLOCK NORESULT write.
#
# Reference: WP-CPS-06 / TSK-218 / PR #121
# Reference: https://www.ibm.com/docs/en/zos/2.5.0?topic=irxexec-routine
# ---------------------------------------------------------------
[[module]]
name = "IRXEXEC"
rent = true
reus = true
entry = "IRXEXEC"
startup = false
sources = [
  "asm/irxexec.asm",
  "src/irx#exec.c",
  "src/irx#bcom.c",
  "src/irx#bvm.c",
  "src/irx#bctl.c",
  "src/irx#init.c",
  "src/irx#term.c",
  "src/irx#stor.c",
  "src/irx#anch.c",
  "src/irx#svc.c",
  "src/irx#uid.c",
  "src/irx#msid.c",
  "src/irx#cond.c",
  "src/irx#emsg.c",
  "src/irx#bif.c",
  "src/irx#bifs.c",
  "src/irx#lstr.c",
  "src/irx#tokn.c",
  "src/irx#vpol.c",
  "src/irx#pars.c",
  "src/irx#ctrl.c",
  "src/irx#arith.c",
  "asm/istso.asm",
]

# ---------------------------------------------------------------
# IRXIOTSO - TSO I/O replaceable routine (WP-33-TSO).
# A load module of its own, not a CSECT linked into everything:
# SC28-1883-0 Chapter 16 names replaceable routines in MODNAMET and
# IRXINIT LOADs the one the environment asks for. IRXTSPRM names
# IRXIOTSO, IRXPARMS leaves the slot blank and keeps the stdio routine
# in irx#io.c -- so no load module carries a routine it never calls.
#
# Writes through PUTLINE (asm/putlin.asm calls IKJPUTL), which reaches
# the terminal in the foreground and SYSTSPRT in the background TMP.
# TPUT would not: SVC 93 does nothing in an address space with no TSB.
# PUTLINE touches no libc state, so it works where no C runtime exists:
# the TSO address space, where IKJEFT01 and IKJCT430 are assembler.
#
# startup = false: it is called, not started. IRXTERM DELETEs it.
# ---------------------------------------------------------------
[[module]]
name = "IRXIOTSO"
rent = true
reus = true
entry = "IRXIOTSO"
startup = false
sources = ["src/irx#tsio.c", "asm/putlin.asm"]

# ---------------------------------------------------------------
# IRXINOUT / IRXUID / IRXMSGID - the default replaceable routines
# (SC28-1883-0 Chapter 16) as load modules of their own (#255), like
# IRXIOTSO. IRXINIT LOADs them into IRXEXTE and writes their names
# into the environment's MODNAMET copy; IRXTERM DELETEs them. Nothing
# points into IRXINIT afterwards, and IRXINIT links no stdio (#298).
#
# IRXINOUT writes through stdio, so it needs the caller's C runtime
# (IRXJCL). It is LOADed only where it is the active I/O routine;
# under TSO IRXTSPRM names IRXIOTSO instead.
#
# startup = false: they are called, not started.
# ---------------------------------------------------------------
[[module]]
name = "IRXINOUT"
rent = true
reus = true
entry = "IRXINOUT"
startup = false
sources = ["src/irx#io.c", "asm/irxqsam.asm", "src/irx#stor.c"]

[[module]]
name = "IRXUID"
rent = true
reus = true
entry = "IRXUID"
startup = false
sources = ["src/irx#uid.c"]

[[module]]
name = "IRXMSGID"
rent = true
reus = true
entry = "IRXMSGID"
startup = false
sources = ["src/irx#msid.c"]

# ---------------------------------------------------------------
# IRXDBG - Debug / Inspection Tool.
# Inspects IRXANCHR state, ECT/ECTENVBK slot, and ENVBLOCK fields.
# Useful during WP-I1c development to verify IRXINIT/IRXTERM state.
#
# Invocation:
#   TSO  :  CALL 'hlq.LOAD(IRXDBG)' 'ANCH'
#   TSO  :  CALL 'hlq.LOAD(IRXDBG)' 'CLEAR'
#   TSO  :  CALL 'hlq.LOAD(IRXDBG)' 'ECT'
#   TSO  :  CALL 'hlq.LOAD(IRXDBG)' 'ENV'
#   TSO  :  CALL 'hlq.LOAD(IRXDBG)' 'ENV 18BC5C90'
# ---------------------------------------------------------------
[[module]]
name = "IRXDBG"
rent = false             # C program with @@CRT0: not reusable
reus = false
sources = ["src/irxdbg.c", "src/irx#anch.c", "src/irx#svc.c"]

[[module]]
